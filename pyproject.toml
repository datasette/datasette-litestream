[project]
name = "datasette-litestream"
version = "0.3a0"
description = "Datasette plugin for continuously backing up SQLite databases with Litestream"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
dependencies = [
    "datasette>=1.0a38",
    "datasette-plugin-router>=0.0.1a6",
    "datasette-vite>=0.0.1a4",
    "httpx",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/datasette/datasette-litestream"
Changelog = "https://github.com/datasette/datasette-litestream/releases"
Issues = "https://github.com/datasette/datasette-litestream/issues"
CI = "https://github.com/datasette/datasette-litestream/actions"

[project.entry-points.datasette]
litestream = "datasette_litestream"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
    "ty>=0.0.68",
]

[tool.uv]
package = true

# TODO: remove once datasette 1.0a38 is on PyPI. Until then, resolve datasette
# from the first-request lifecycle branch stack (add_background_task, the
# shutdown hook) that 1.0a38 will ship.
[tool.uv.sources]
datasette = { git = "https://github.com/simonw/datasette", branch = "asg017/first-request-7-docs-and-changelog" }

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
datasette_litestream = ["bin/*", "templates/*.html", "static/**/*", "manifest.json"]
