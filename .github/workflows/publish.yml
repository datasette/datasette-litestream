name: Publish Python Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download litestream (checksum-verified)
        run: |
          asset="litestream-0.5.12-linux-x86_64.tar.gz"
          curl -fLO "https://github.com/benbjohnson/litestream/releases/download/v0.5.12/${asset}"
          echo "$(./download.sh sha256-for "${asset}")  ${asset}" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "${asset}" -C "$HOME/.local/bin" litestream
          echo "LITESTREAM_TEST_BINARY=$HOME/.local/bin/litestream" >> "$GITHUB_ENV"
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Run tests
        run: |
          uv run python -m pytest
  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          pip install setuptools wheel twine build
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build wheels
        run: |
          ./download.sh
          ./build.sh
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m build
          twine upload dist/*
