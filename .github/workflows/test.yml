name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: cache-litestream
        uses: actions/cache@v3
        with:
          path: $HOME/.local/bin/litestream
          key: ${{ runner.os }}-litestream-0.5.12
      - run: mkdir -p $HOME/.local/bin
      - if: steps.cache-litestream.outputs.cache-hit != 'true'
        run: curl -L https://github.com/benbjohnson/litestream/releases/download/v0.5.12/litestream-0.5.12-linux-x86_64.tar.gz | tar -xz -C $HOME/.local/bin litestream
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Run backend tests
        run: |
          uv run python -m pytest
      - name: Run frontend tests
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run test
